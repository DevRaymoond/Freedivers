# /etc/nginx/sites-available/multipunk  (troque jogo.exemplo.com pelo seu domínio e gere o certificado com certbot)
server {
    listen 80;
    server_name jogo.exemplo.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name jogo.exemplo.com;
    ssl_certificate     /etc/letsencrypt/live/jogo.exemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jogo.exemplo.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;      # sobrescreve: o cliente não consegue forjar o IP
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8k;
    }
    # WebSocket das salas online
    location /ws {
        proxy_pass http://127.0.0.1:8765/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
